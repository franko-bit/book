<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Test Groq Proxy</title>
</head>
<body>
  <h2>Test Groq Proxy</h2>
  <textarea id="body" rows="8" cols="60">{"model":"qwen/qwen3.6-27b","messages":[{"role":"user","content":"Say hello"}]}</textarea>
  <br/>
  <button id="send">Send POST /api/groq</button>
  <pre id="out"></pre>

  <script>
    document.getElementById('send').addEventListener('click', async () => {
      const out = document.getElementById('out');
      out.textContent = 'Sending...';
      try {
        const body = JSON.parse(document.getElementById('body').value);
        const resp = await fetch('/api/groq', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const text = await resp.text();
        out.textContent = `Status: ${resp.status}\n\n${text}`;
      } catch (err) {
        out.textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
